<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Télécharger MyPCS</title>
  <script>
    // Secours côté client (ex. iPad qui se présente comme un Mac, ou middleware contourné)
    (function () {
      var ua = navigator.userAgent || '';
      var isIPadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
      if (/android/i.test(ua)) {
        location.replace('https://play.google.com/store/apps/details?id=com.pcs.mypcs&hl=fr');
      } else if (/iphone|ipad|ipod/i.test(ua) || isIPadOS) {
        location.replace('https://apps.apple.com/fr/app/mypcs/id1507144448');
      }
    })();
  </script>
  <style>
    :root { --bg: #f5f6f8; --card: #ffffff; --text: #1a1a1a; --muted: #666; --btn: #111; --btn-text: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111317; --card: #1c1f24; --text: #f2f2f2; --muted: #a0a0a0; --btn: #f2f2f2; --btn-text: #111; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { background: var(--card); border-radius: 16px; padding: 32px 24px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a.btn {
      display: block; padding: 14px 16px; margin-top: 12px; border-radius: 10px;
      background: var(--btn); color: var(--btn-text); text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>MyPCS</h1>
    <p>Téléchargez l'application sur votre smartphone.</p>
    <a class="btn" href="https://apps.apple.com/fr/app/mypcs/id1507144448">Télécharger sur l'App Store</a>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.pcs.mypcs&amp;hl=fr">Disponible sur Google Play</a>
  </main>
</body>
</html>
