  <style>
    @font-face {
      font-family: "Obviously Narrow";
      src: url("https://cdn.prod.website-files.com/6a9d30373bf9c5ea5a7c0cf7/6a9d30373bf9c5ea5a7c0dd9_ObviouslyNarrow-Bold.otf") format("opentype");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --red: #da2f26;
      --gradient: linear-gradient(180deg, #da2f26 0%, #e9495b 66%, #ea534d 93%, #de6a21 108%);
      --beige: #f3ede7;
      --text: #000;
      --text-secondary: #3e3e3e;
      --border: #d9d9d9;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: var(--text);
      font-family: Figtree, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }
    header svg { display: block; height: 22px; width: auto; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px 64px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 14px;
      margin-bottom: 20px;
      border-radius: 999px;
      background: var(--beige);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    h1 {
      margin: 0 0 16px;
      font-family: "Obviously Narrow", "Arial Narrow", Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(44px, 11vw, 72px);
      line-height: .95;
      text-transform: uppercase;
      letter-spacing: -.01em;
    }
    h1 .accent {
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p.lead {
      margin: 0 auto 36px;
      max-width: 400px;
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1.45;
    }

    .stores {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .stores a {
      display: block;
      border-radius: 8px;
      background: #000;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .stores a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, .18);
    }
    .stores a:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
    .stores svg { display: block; height: 52px; width: auto; }

    footer {
      background: #000;
      color: #c7c2bc;
      clip-path: polygon(0 0, 100% 40%, 100% 100%, 0 100%);
      padding: 56px 24px 24px;
      font-size: 13px;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .stores a { transition: none; }
    }
  </style>
